name: Platform tests

on:
  push:
    branches:
      - upgrade/v3-dashboard-analytics
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    defaults:
      run:
        working-directory: coin_futures_paper_agent_v2_1/coin_futures_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q app
      - name: Test
        run: pytest -q
      - name: JavaScript syntax and marker tests
        run: |
          node --check app/trade_charts.js
          python -c 'import re; from app.dashboard_v43 import DASHBOARD_HTML_V43; m=re.search(r"<script>([\s\S]*?)</script>", DASHBOARD_HTML_V43); assert m, "inline script not found"; print(m.group(1))' > /tmp/coin_dashboard_inline.js
          node --check /tmp/coin_dashboard_inline.js
          node tests/test_trade_charts.js
